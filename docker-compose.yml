services:
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_BASE_URL: http://mcp:8100
      USE_LOCAL_RETRIEVAL: ${USE_LOCAL_RETRIEVAL:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      - mcp

  mcp:
    build: .
    command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"

  ui:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000/api
    depends_on:
      - api
